name: Spark Data Comparator CI

on:
  pull_request:
    branches: [ "main", "releases" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, and Verify Publish (Java 21, Spark 4.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Execute Enterprise Test Suite
      run: ./gradlew clean test

    - name: Verify Maven Local Publishing
      run: ./gradlew publishToMavenLocal

    - name: Upload ScalaTest HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scalatest-html-report
        path: build/reports/scalatest/
        retention-days: 14