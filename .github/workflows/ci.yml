name: Spark Data Comparator CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Java 21, Spark 4.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches downloaded Maven dependencies

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Execute Enterprise Test Suite
      run: ./gradlew clean test

    - name: Upload ScalaTest HTML Report
      if: always() # Ensures the report is uploaded even if a test fails
      uses: actions/upload-artifact@v4
      with:
        name: scalatest-html-report
        path: build/reports/scalatest/
        retention-days: 14